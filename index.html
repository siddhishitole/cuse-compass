<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CuseCompass</title>
<meta name="description" content="Find the room, not just the building. Plan your day, pick an event, and point your camera at a door number to see what's happening inside.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230B1146'/%3E%3Cpath d='M32 10l6 22H26z' fill='%23FF6B1A'/%3E%3Cpath d='M32 54l-6-22h12z' fill='%23F3F5FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5FF; --surface:#FFFFFF; --ink:#0B1146; --muted:#5A6396; --line:#DADFF3;
  --tang:#FF6B1A; --lemon:#FFD84D; --sky:#9CCBFF; --on-tang:#1A0A00; --dial:#0B1146;
  --c-creative:rgba(255,107,26,.16); --c-product:rgba(156,203,255,.34); --c-all:rgba(255,216,77,.30);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#080C33; --surface:#0F1654; --ink:#F3F5FF; --muted:#A5AFE6; --line:#252E7A; --dial:#05082B;
    --c-creative:rgba(255,107,26,.20); --c-product:rgba(156,203,255,.18); --c-all:rgba(255,216,77,.16);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#080C33; --surface:#0F1654; --ink:#F3F5FF; --muted:#A5AFE6; --line:#252E7A; --dial:#05082B;
  --c-creative:rgba(255,107,26,.20); --c-product:rgba(156,203,255,.18); --c-all:rgba(255,216,77,.16);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;}
h1,h2,h3{font-family:var(--f-display);font-weight:500;letter-spacing:-0.02em;line-height:1.1;margin:0;}
p{margin:0;}
:focus-visible{outline:2px solid var(--tang);outline-offset:3px;}
.ln{color:inherit;font-weight:500;text-decoration:underline;text-decoration-color:var(--tang);text-decoration-thickness:1.5px;text-underline-offset:3px;}

/* shell */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:720px;margin:0 auto;padding:16px 20px 0;}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;font:600 19px var(--f-display);letter-spacing:-0.02em;}
.logo svg{width:30px;height:30px;transition:transform .6s cubic-bezier(.3,1.5,.5,1);}
.logo:hover svg,.logo:focus-visible svg{transform:rotate(60deg);}
.hnote{color:var(--muted);font-size:13.5px;}
main{max-width:720px;margin:0 auto;padding:8px 20px 130px;}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--paper);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);}
.nav button{position:relative;flex:1;max-width:116px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:0;border-radius:14px;background:transparent;color:var(--muted);font:500 12px var(--f-body);cursor:pointer;transition:color .2s;}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.nav button.on{color:var(--tang);}
.nav button.on::after{content:"";position:absolute;bottom:-2px;width:5px;height:5px;border-radius:50%;background:var(--tang);}
.cnt{position:absolute;top:-1px;right:16px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--tang);color:var(--on-tang);font:600 11px/18px var(--f-body);font-style:normal;text-align:center;}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden;}
.cf{position:absolute;width:8px;height:8px;border-radius:2px;}

/* buttons and controls */
.btn{display:inline-block;text-decoration:none;font:600 15px var(--f-body);cursor:pointer;padding:11px 22px;border:1px solid var(--tang);border-radius:999px;background:var(--tang);color:var(--on-tang);transition:transform .12s,background .2s;}
.btn:active{transform:scale(.97);}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.btn.ghost:hover{border-color:var(--tang);}
.btn.sm{padding:7px 15px;font-size:14px;}
.btn.big{padding:14px 30px;font-size:16.5px;}
.btn[disabled]{opacity:.45;cursor:default;}
.btn[aria-pressed=true]{background:rgba(255,107,26,.16);color:var(--ink);border-color:var(--tang);}
.btn.pop{animation:stampin .4s cubic-bezier(.3,1.6,.5,1);}
@keyframes stampin{0%{transform:scale(1.35);}100%{transform:scale(1);}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.chip{font:500 14px var(--f-body);cursor:pointer;padding:7px 15px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);transition:border-color .2s,background .2s;}
.chip:hover{border-color:var(--tang);}
.chip[aria-pressed=true]{background:rgba(255,107,26,.16);border-color:var(--tang);}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;}
.d-creative{background:var(--tang);} .d-product{background:var(--sky);} .d-all{background:var(--lemon);}
.sticker{font-size:14.5px;}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);margin:14px 0;}
.seg button{flex:1;font:500 14.5px var(--f-body);padding:9px 8px;border:0;background:transparent;color:var(--muted);cursor:pointer;}
.seg button[aria-pressed=true]{background:rgba(255,107,26,.16);color:var(--ink);}
.ctl{display:flex;gap:8px;margin:10px 0 0;}
.ctl input,#askIn,.lookup input{flex:1;min-width:0;font:400 16px var(--f-body);padding:12px 18px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);}
.ctl input::placeholder,#askIn::placeholder,.lookup input::placeholder{color:var(--muted);}
.note{margin:14px 0;padding:11px 15px;border-left:3px solid var(--lemon);background:var(--surface);font-size:14.5px;border-radius:4px 14px 14px 4px;color:var(--muted);}
.empty{margin:24px 0;color:var(--muted);font-size:16.5px;}
.src{color:var(--muted);font-size:13px;}
.back{background:none;border:0;color:var(--muted);font:500 14.5px var(--f-body);cursor:pointer;padding:8px 0;}
.back::before{content:"‹  ";}
.lead{margin:10px auto 0;max-width:34ch;color:var(--muted);font-size:16.5px;}
.lead.left{margin:8px 0 0;max-width:46ch;}

/* home */
.hero{padding:18px 0 4px;text-align:center;}
.dialwrap{width:min(56vw,210px);margin:0 auto 8px;}
#dial{display:block;width:100%;height:auto;overflow:visible;}
#needle{transform-origin:150px 150px;transition:transform 2.6s cubic-bezier(.12,.7,.15,1);}
#needle.idle{animation:sway 6s ease-in-out infinite alternate;}
@keyframes sway{from{transform:rotate(-7deg);}to{transform:rotate(7deg);}}
.hero h1{font-size:clamp(34px,8vw,48px);margin-top:14px;}
.sur{margin-top:14px;}
.res{margin:18px auto 0;max-width:520px;text-align:left;border:1px solid var(--line);border-left:3px solid var(--zone,var(--tang));border-radius:6px 22px 22px 6px;padding:16px 20px 18px;background:var(--surface);}
.res.fresh{animation:rise .5s cubic-bezier(.2,.8,.2,1);}
@keyframes rise{from{transform:translateY(10px);opacity:0;}to{transform:none;opacity:1;}}
.tagc{display:inline-block;margin-bottom:6px;color:var(--zone,var(--tang));font:600 14px var(--f-display);}
.res h2{font-size:23px;}
.res p{margin:6px 0 14px;color:var(--muted);}
.choices{display:grid;gap:12px;margin:26px 0 0;}
@media (min-width:560px){.choices{grid-template-columns:1fr 1fr;}}
.choice{display:flex;flex-direction:column;gap:4px;text-align:left;padding:18px 20px;border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);cursor:pointer;transition:border-color .2s,transform .15s;}
.choice:hover{border-color:var(--tang);}
.choice[aria-pressed=true]{border-color:var(--tang);background:rgba(255,107,26,.10);}
.choice strong{font:500 21px var(--f-display);letter-spacing:-0.02em;}
.choice em{font-style:normal;color:var(--muted);font-size:14.5px;}
.choice svg{width:26px;height:26px;fill:none;stroke:var(--tang);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px;}
.below{margin:14px 0 0;text-align:center;color:var(--muted);font-size:14.5px;}
.below button{background:none;border:0;padding:0;color:var(--ink);font:inherit;font-weight:500;cursor:pointer;text-decoration:underline;text-decoration-color:var(--tang);text-underline-offset:3px;}
.panel{margin:16px 0 0;padding:18px 20px;border:1px solid var(--line);border-radius:22px;background:var(--surface);}
.panel h3{font-size:19px;margin-bottom:4px;}
.blds{display:grid;gap:10px;margin-top:12px;}
.bcard{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:var(--paper);color:var(--ink);cursor:pointer;transition:border-color .2s;}
.bcard:hover{border-color:var(--tang);}
.bcard strong{font:500 19px var(--f-display);display:block;}
.bcard em{font-style:normal;color:var(--muted);font-size:14px;}
.bdot{flex:none;width:12px;height:12px;border-radius:50%;}
.bd-nh1{background:var(--tang);} .bd-nh2{background:var(--sky);} .bd-nh3{background:var(--lemon);}
.bh{font-size:32px;margin-top:4px;}
.evl{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px;}
.evt{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:var(--surface);}
details.more{margin:22px 0 0;border:1px solid var(--line);border-radius:18px;background:var(--surface);}
details.more summary{cursor:pointer;padding:14px 18px;font:500 16px var(--f-display);list-style:none;}
details.more summary::-webkit-details-marker{display:none;}
details.more summary::after{content:"+";float:right;color:var(--tang);font-size:20px;line-height:1;}
details.more[open] summary::after{content:"–";}
.moreb{padding:0 18px 16px;}
.moreb h3{font-size:17px;margin:14px 0 4px;}
.rc{padding:10px 0;border-top:1px solid var(--line);}
.rc b{font:500 16px var(--f-display);}
.rc ul,.plain{margin:4px 0 0;padding-left:20px;}
.plain li{margin:8px 0;}

/* scan page and results */
.scanhead h2{font-size:32px;}
.scanhead p{margin-top:8px;color:var(--muted);max-width:44ch;}
.lookup{display:flex;gap:8px;margin:18px 0 0;}
.sres{margin:16px 0 0;padding:16px 18px;border:1px solid var(--line);border-left:3px solid var(--tang);border-radius:6px 20px 20px 6px;background:var(--surface);}
.sres h3{font-size:22px;}
.sres .tags{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px;}
.tag{padding:2px 12px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;color:var(--muted);}
.sres ul{margin:6px 0 0;padding-left:18px;}
.sres li{margin:5px 0;}
.sres .sub{color:var(--muted);font-size:14.5px;margin-top:6px;}
.banner{margin:0 0 10px;padding:8px 12px;border-radius:12px;font-size:14.5px;background:rgba(255,216,77,.22);}
.banner.ok{background:rgba(255,107,26,.2);}
.found{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
h2.sec2{font-size:20px;margin:26px 0 0;}

/* ask */
.askhead h2{font-size:32px;margin-bottom:6px;}
.askhead p{color:var(--muted);max-width:44ch;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px;}
.chat{display:flex;flex-direction:column;gap:10px;margin:14px 0;}
.msg{max-width:88%;padding:11px 16px;white-space:pre-wrap;font-size:16px;line-height:1.5;}
.msg.u{align-self:flex-end;background:rgba(255,107,26,.18);border-radius:20px 20px 4px 20px;}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 20px 4px;}
.msg small{display:block;margin-top:6px;color:var(--muted);font-size:13px;}
.msg .btn{margin-top:10px;margin-right:6px;}
.dots{display:inline-flex;gap:5px;padding:5px 0;}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:bob 1s infinite ease-in-out;}
.dots i:nth-child(2){animation-delay:.15s;} .dots i:nth-child(3){animation-delay:.3s;}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-5px);opacity:1;}}
.askrow{display:flex;gap:8px;position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--paper);padding:10px 0;}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 0;}
.ck2{display:flex;align-items:center;gap:8px;font-size:14.5px;cursor:pointer;color:var(--muted);}
.ck2 input{width:18px;height:18px;accent-color:var(--tang);}

/* schedule */
.tl{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px;}
.tix{display:grid;grid-template-columns:96px 1fr auto;align-items:center;border:1px solid var(--line);border-radius:20px;background:var(--surface);overflow:hidden;}
.stub{align-self:stretch;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px 6px;border-right:1px dashed var(--line);}
.stub b{font:500 16px var(--f-display);line-height:1.15;}
.stub i{font-style:normal;font-size:12.5px;line-height:1.2;margin-top:3px;color:var(--muted);}
.t-creative .stub{background:var(--c-creative);} .t-product .stub{background:var(--c-product);} .t-all .stub{background:var(--c-all);}
.tb{padding:12px 14px;min-width:0;}
.ttl{font:500 17px/1.25 var(--f-display);letter-spacing:-0.01em;}
.who{color:var(--muted);font-size:14.5px;margin-top:3px;}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px;font-size:14.5px;}
.b{display:inline-block;padding:0 9px;border:1px solid var(--line);border-radius:999px;font:500 12.5px var(--f-body);color:var(--muted);}
.loc{padding:0;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--tang);text-decoration-thickness:1.5px;text-underline-offset:3px;}
.loc.none{text-decoration:none;color:var(--muted);cursor:default;}
.tix .btn{margin-right:14px;}
.tip{margin-top:6px;font-size:14px;color:var(--muted);}
.hint{margin:0;padding:9px 14px;border-left:3px solid var(--tang);background:var(--surface);border-radius:4px 14px 14px 4px;font-size:14.5px;color:var(--muted);}
h2.day{font-size:22px;margin:22px 0 2px;}
@media (max-width:540px){
  .tix{grid-template-columns:80px 1fr;}
  .tix .btn{grid-column:1 / -1;margin:0 14px 14px;}
}

/* around */
.roll{border:1px solid var(--line);border-left:3px solid var(--lemon);border-radius:6px 22px 22px 6px;padding:18px 20px;background:var(--surface);margin:12px 0 18px;}
.rollname{font:500 clamp(26px,7vw,34px) var(--f-display);letter-spacing:-0.02em;line-height:1.05;min-height:1.1em;}
.roll p{margin:8px 0 14px;color:var(--muted);font-size:15.5px;}
.sec{margin:26px 0 0;}
.sec h2{font-size:22px;margin-bottom:4px;}
.sec .sub{color:var(--muted);font-size:14.5px;margin-bottom:6px;}
.rts{list-style:none;margin:8px 0 0;padding:0;}
.rt{margin:8px 0;padding:10px 14px;background:var(--surface);border-left:4px solid var(--c,var(--line));border-radius:4px 16px 16px 4px;font-size:15px;}
.rt strong{font-family:var(--f-display);font-weight:500;font-size:16.5px;}
.rt-orange{--c:var(--tang);} .rt-blue{--c:var(--sky);}

/* live scanner */
.cam{position:fixed;inset:0;z-index:70;background:#000;color:#F3F5FF;}
.cam[hidden]{display:none;}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.camtop{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;align-items:center;gap:10px;}
.cam .btn.ghost{color:#F3F5FF;border-color:rgba(243,245,255,.55);background:rgba(5,8,43,.5);}
.camtarget{flex:1;padding:7px 14px;border-radius:999px;background:rgba(5,8,43,.7);font-size:14px;line-height:1.3;}
.reticle{position:absolute;left:12%;right:12%;top:20%;height:24%;pointer-events:none;}
.reticle i{position:absolute;width:26px;height:26px;border:3px solid var(--tang);}
.reticle i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0;}
.reticle i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0;}
.reticle i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px;}
.reticle i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0;}
.sweep{position:absolute;left:6px;right:6px;top:0;height:2px;background:var(--tang);opacity:0;}
.reticle.scan .sweep{opacity:.9;animation:sweep 1.4s ease-in-out infinite alternate;}
@keyframes sweep{from{top:6%;}to{top:94%;}}
.camdock{position:absolute;left:0;right:0;bottom:0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(5,8,43,.9) 22%);}
.camstatus{font-size:15px;margin-bottom:8px;text-shadow:0 1px 8px rgba(0,0,0,.8);}
.camcard{max-height:34vh;overflow:auto;margin-bottom:10px;padding:14px 16px;border-radius:20px;background:rgba(15,22,84,.94);border:1px solid rgba(243,245,255,.18);color:#F3F5FF;}
.camcard h3{font-size:21px;}
.camcard .tag{border-color:rgba(243,245,255,.3);color:#C9D0F5;}
.camcard .sub{color:#C9D0F5;}
.camcard .banner{color:#F3F5FF;}
.camform{display:flex;gap:8px;margin-bottom:10px;}
.camform input{flex:1;min-width:0;font:400 15px var(--f-body);padding:9px 16px;border:1px solid rgba(243,245,255,.35);border-radius:999px;background:rgba(5,8,43,.6);color:#F3F5FF;}
.camform input::placeholder{color:#A5AFE6;}
.camctl{display:flex;gap:10px;justify-content:center;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;}
}
</style>
</head>
<body>
<header class="top">
  <button class="logo" id="logo" type="button" aria-label="CuseCompass home">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#0B1146" stroke="#FF6B1A" stroke-width="3"/><path d="M32 11l6 21H26z" fill="#FF6B1A"/><path d="M32 53l-6-21h12z" fill="#F3F5FF"/><circle cx="32" cy="32" r="3" fill="#0B1146"/></svg>
    CuseCompass
  </button>
  <span class="hnote">AI Creative Summit</span>
</header>
<main id="view"></main>
<nav class="nav" id="nav" aria-label="Main"></nav>
<div id="fx" aria-hidden="true"></div>

<div class="cam" id="cam" hidden role="dialog" aria-label="Live room scanner">
  <video id="camVid" playsinline muted autoplay></video>
  <div class="camtop"><button class="btn ghost sm" data-camclose="1" type="button">Close</button><div class="camtarget" id="camTarget" hidden></div></div>
  <div class="reticle" id="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i><span class="sweep"></span></div>
  <div class="camdock">
    <div class="camstatus" id="camStatus" aria-live="polite"></div>
    <div class="camcard" id="camCard" hidden></div>
    <form class="camform" id="camForm" autocomplete="off"><input id="camNum" type="text" placeholder="Or type a room number" aria-label="Type a room number"><button class="btn sm" type="submit">Look up</button></form>
    <div class="camctl"><button class="btn" id="camBtn" data-camread="1" type="button">Scan now</button><button class="btn ghost" id="camAuto" data-camauto="1" aria-pressed="true" type="button">Auto-scan on</button></div>
  </div>
</div>

<script>

function parseAI(t){
  try {
    const m = String(t).match(/\{[\s\S]*\}/), o = JSON.parse(m ? m[0] : t);
    const ids = (Array.isArray(o.add) ? o.add : []).filter(id => SESSIONS.some(s => s.id === id));
    return {reply:String(o.reply || '').trim() || 'Sorry, I had trouble answering that.', add:ids};
  } catch (e) { return {reply:String(t || '').trim() || 'Sorry, I had trouble answering that.', add:[]}; }
}
function localAnswer(q){
  if (/plan/i.test(q)) {
    const day = /day\s*2/i.test(q) ? 2 : 1;
    const track = /product|coding|building|vibe/i.test(q) ? 'product' : /creative|image|audio|video|firefly/i.test(q) ? 'creative' : 'all';
    const pool = SESSIONS.filter(s => s.day === day && (track === 'all' || s.track === 'all' || s.track === track)).sort((a, b) => a.s - b.s || (a.track === 'all' ? -1 : 1));
    const picks = []; let end = 0;
    pool.forEach(s => { if (s.s >= end) { picks.push(s); end = s.e; } });
    if (picks.length) return {reply:'The AI isn’t connected right now, so here’s a plan built from the schedule:\n' + picks.map(s => `${s.time}: ${s.title} (${s.loc || 'room not listed'})`).join('\n'), add:picks.map(s => s.id), offline:true};
  }
  const stop = new Set('the and for you are what when where which who how can does with from that this have has any near about tell give there will would should could into your our its'.split(' '));
  const t = q.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !stop.has(w));
  const hits = SESSIONS.map(s => ({s, sc:t.filter(w => sessText(s).toLowerCase().includes(w)).length})).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 4);
  if (!hits.length) return {reply:'The AI isn’t connected right now and I found no matching session. Try the Schedule or Around tabs, or ask an organizer.', add:[], offline:true};
  return {reply:'The AI isn’t connected right now, so here are the best matches from the schedule:\n' + hits.map(x => `Day ${x.s.day}, ${x.s.time}: ${x.s.title} (${x.s.loc || 'room not listed'})`).join('\n'), add:hits.map(x => x.s.id), offline:true};
}

/* ===== confetti that answers a tap ===== */
function burst(x, y){
  if (reduce) return;
  const fx = $('fx'), colors = ['#FF6B1A', '#FFD84D', '#9CCBFF', '#F3F5FF'];
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('span'); p.className = 'cf'; p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.background = colors[i % 4];
    fx.appendChild(p);
    const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 70;
    const an = p.animate([{transform:'translate(0,0) rotate(0deg)', opacity:1}, {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d + 36}px) rotate(${Math.random()*540}deg)`, opacity:0}], {duration:700 + Math.random()*300, easing:'cubic-bezier(.2,.7,.3,1)'});
    an.onfinish = () => p.remove();
  }
}

/* ===== the compass ===== */
function dialSVG(){
  let ticks = '';
  for (let i = 0; i < 72; i++) {
    const a = i * 5 * Math.PI / 180, major = i % 6 === 0, r1 = major ? 120 : 126, r2 = 132;
    ticks += `<line x1="${(150 + r1*Math.sin(a)).toFixed(1)}" y1="${(150 - r1*Math.cos(a)).toFixed(1)}" x2="${(150 + r2*Math.sin(a)).toFixed(1)}" y2="${(150 - r2*Math.cos(a)).toFixed(1)}" stroke="#F3F5FF" stroke-width="${major ? 1.6 : 0.8}" opacity="${major ? .65 : .35}"/>`;
  }
  const lit = st.spin.pick ? st.spin.pick.i : -1;
  let zones = '';
  ZONES.forEach(([n, c], i) => {
    const a = i * 72 * Math.PI / 180, dx = 150 + 104*Math.sin(a), dy = 150 - 104*Math.cos(a), tx = 150 + 80*Math.sin(a), ty = 150 - 80*Math.cos(a);
    zones += `<circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="${lit === i ? 7 : 4.5}" fill="${c}"/>` +
      `<text x="${tx.toFixed(1)}" y="${(ty + 4.5).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="${lit === i ? 600 : 500}" fill="#F3F5FF" style="font-family:var(--f-display)" opacity="${lit === -1 || lit === i ? 1 : .55}">${n}</text>`;
  });
  const idle = !st.spin.did && st.spin.rot === 0;

let camStream = null, camTimer = null, camBusy = false, camAuto = true, camScans = 0, camLast = '';

    const v = $('camVid'); v.srcObject = camStream; await v.play();

function grabFrame(){
  const v = $('camVid'); if (!v.videoWidth) return null;
  const k = Math.min(1, 1024 / Math.max(v.videoWidth, v.videoHeight)), c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  const url = c.toDataURL('image/jpeg', 0.7); return {media_type:'image/jpeg', data:url.split(',')[1]};
}

    return [...new Set((Array.isArray(o.numbers) ? o.numbers : []).map(x => String(x).toUpperCase().replace(/[^0-9A-Z]/g, '')).filter(x => /^\d{3}[A-Z]{0,2}$/.test(x)))];
  } catch (e) { return []; }
}

let voicePlayer = null;
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
function unlockAudio(){ try { if (!voicePlayer) voicePlayer = new Audio(); voicePlayer.src = SILENT; const p = voicePlayer.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }

  if (!text) return; stopSpeak();
  try {
    const r = await fetch('/api/speak', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({text:String(text).slice(0, 600)})});
    if (!r.ok) throw new Error('HTTP ' + r.status);

    await new Promise((res, rej) => { voicePlayer.onended = res; voicePlayer.onerror = rej; const p = voicePlayer.play(); if (p && p.catch) p.catch(rej); });
  } catch (e) {

      await new Promise(res => { const u = new window.SpeechSynthesisUtterance(String(text)); u.onend = res; u.onerror = res; window.speechSynthesis.speak(u); });

}

async function askAI(q){
  stopSpeak();
  st.chat.push({role:'user', content:q}); st.busy = true; renderChat();
  const history = st.chat.slice(-8).map(m => ({role:m.role, content:m.content}));
  let out;
  try {
    const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 40000);
    const r = await fetch('/api/ask', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({messages:history, context:buildContext()}), signal:ctrl.signal});
    clearTimeout(to);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    out = parseAI((await r.json()).text);
  } catch (e) { out = localAnswer(q); }
  st.chat.push({role:'assistant', content:out.reply, add:out.add || [], offline:!!out.offline});
  st.busy = false; renderChat();

}

  const track = s.track === 'creative' ? 'Creative track' : s.track === 'product' ? 'Product Dev track' : '';
  const loc = s.loc ? (s.b ? `<button class="loc" data-bld="${s.b}" data-room="${esc(s.rooms[0] || '')}" type="button">${esc(s.loc)}</button>` : `<span class="loc none">${esc(s.loc)}</span>`) : `<span class="loc none">Room not listed in the deck. Ask an organizer.</span>`;
  return `<li class="tix t-${s.track}"><div class="stub">${timeStub(s.time)}</div>
    <div class="tb"><div class="ttl">${esc(s.title)}</div>${s.who ? `<div class="who">${esc(s.who)}</div>` : ''}
      <div class="meta">${s.b ? `<span class="b">${BUILDINGS[s.b].replace('Newhouse ', 'NH')}</span>` : ''}${track ? `<span class="who">${track}</span>` : ''}</div>
      <div class="meta">${loc}</div>${s.tip ? `<div class="tip">${esc(s.tip)}</div>` : ''}</div>
    <button class="btn sm${st.pop === s.id ? ' pop' : ''}" data-save="${s.id}" aria-pressed="${saved}" type="button">${saved ? 'Saved' : 'Save'}</button></li>`;
}
function planHint(prev, s){
  if (s.s < prev.e) return `This overlaps with “${prev.title}”. You’ll need to choose.`;
  const gap = s.s - prev.e;
  if (prev.b && s.b && prev.b !== s.b) return `Change buildings: ${BUILDINGS[prev.b]} to ${BUILDINGS[s.b]}. You have ${gap} min. The three Newhouse buildings connect indoors.`;
  if (prev.b && s.b && prev.b === s.b && prev.rooms[0] !== s.rooms[0]) return `Same building (${BUILDINGS[s.b]}), different room. You have ${gap} min.`;
  return '';
}
function viewSchedule(){
  const tracks = [['all', 'All talks', 'all'], ['creative', 'Creative', 'creative'], ['product', 'Product Dev', 'product']];
  let h = `<div class="ctl"><input type="search" id="q" placeholder="Search talks, speakers, or rooms" aria-label="Search sessions" value="${esc(st.q)}"></div>
  <div class="seg" role="group" aria-label="View"><button data-day="1" aria-pressed="${st.day === 1 && !st.mine}" type="button">Day 1</button><button data-day="2" aria-pressed="${st.day === 2 && !st.mine}" type="button">Day 2</button><button data-mine="1" aria-pressed="${st.mine}" type="button">My plan (${st.plan.size})</button></div>`;
  if (!st.mine) {
    h += `<div class="row" role="group" aria-label="Track">${tracks.map(([id, label, dot]) => `<button class="chip" data-track="${id}" aria-pressed="${st.track === id}" type="button"><span class="dot d-${dot}"></span>${label}</button>`).join('')}</div>`;
    const list = SESSIONS.filter(s => s.day === st.day && (st.track === 'all' || s.track === 'all' || s.track === st.track) && matches(sessText(s), st.q));
    h += list.length ? `<ul class="tl">${list.map(ticket).join('')}</ul>` : `<p class="empty">No talks match. Clear the search or switch the track.</p>`;
    return h;
  }
  const items = SESSIONS.filter(s => st.plan.has(s.id) && matches(sessText(s), st.q)).sort((a, b) => a.day - b.day || a.s - b.s);
  if (!items.length) return h + `<p class="empty">Nothing saved yet. Tap Save on a talk to build your day. You’ll get a heads-up when you have to change buildings.</p>`;
  [1, 2].forEach(d => {
    const ds = items.filter(s => s.day === d); if (!ds.length) return;
    h += `<h2 class="day">Day ${d}</h2><ul class="tl">`;
    ds.forEach((s, i) => { if (i > 0) { const hint = planHint(ds[i - 1], s); if (hint) h += `<li class="hint">${esc(hint)}</li>`; } h += ticket(s); });
    h += `</ul>`;
  });
  return h;
}

/* ===== around: eat and ride ===== */
function roll(){
  if (st.roll.busy) return;
  st.roll.busy = true; const o = $('rollOut'); if (o) o.innerHTML = '';
  const final = Math.floor(Math.random() * FOOD_SPOTS.length); let n = 0;
  const tick = () => {
    const i = (n < 14 && !reduce) ? Math.floor(Math.random() * FOOD_SPOTS.length) : final;
    const el = $('rollName'); if (el) el.textContent = FOOD_SPOTS[i].name;
    n++;
    if (n < 15 && !reduce) setTimeout(tick, 70 + n * 12); else { st.roll.busy = false; st.roll.i = final; render(); }
  };
  tick();
}
function viewEat(){
  const sp = st.roll.i != null ? FOOD_SPOTS[st.roll.i] : null;
  return `<div class="roll"><div class="rollname" id="rollName">${sp ? esc(sp.name) : 'Hungry? Roll for a spot.'}</div><div id="rollOut">${sp ? `<p>${esc(`${sp.where}. ${sp.note}`.trim())}</p>` : '<p>Picks from real campus eateries.</p>'}</div><button class="btn sm" data-roll="1" type="button">${sp ? 'Roll again' : 'Roll the dice'}</button></div>
  <p class="note">Hours change, so check ${ln('https://campusdining.syr.edu/hours', 'SU’s official hours page')} before you go. The summit schedule also includes lunch on both days.</p>
  <div class="sec"><h2>Eateries near you</h2><p class="sub">Opens your map app. Your location stays on your phone and is only used to center the map.</p>
    <button class="btn ghost sm" data-eat="1" type="button">Show restaurants near me</button><p class="note" id="eatOut" aria-live="polite" hidden></p></div>
  <div class="sec"><h2>Inside Newhouse</h2><ul class="plain"><li><strong>food.com café, Newhouse 3, Room 244.</strong> A Campus Dining café. SU announced Choolaah (Indian BBQ) and Yella’s (breakfast sandwiches, lunch, milkshakes) here in 2025. Their hours have changed more than once.</li></ul></div>
  <div class="sec"><h2>Next door: Schine Student Center</h2><p class="sub">On SU’s map, Schine sits next to Newhouse 1 and 2. Schine Dining is on its second floor.</p><ul class="plain"><li>SU has listed Dunkin’, CoreLife Eatery, Halal Shack, Tavola 44 (pizza), Panda Express, and Biscotti Cafe there. See the ${ln('https://campusdining.syr.edu/retail-dining/food-courts/', 'food court page')} for menus.</li><li>SU says the food halls are open late on weekends.</li></ul></div>
  <div class="sec"><h2>Other campus cafés</h2><p class="sub">SU has 14 cafés in academic buildings, mostly open around 8 a.m. to 3 p.m.</p><ul class="plain"><li><strong>The Canteen</strong>, National Veterans Resource Center (across Waverly Avenue from Newhouse 2 on SU’s map).</li><li><strong>Gerry’s Cafe</strong>, Eggers Hall, Room 300.</li><li><strong>Falk Cafe</strong>, MacNaughton Hall.</li><li><strong>BBBistro</strong>, Brockway Hall, basement.</li></ul><p class="note">${ln('https://campusdining.syr.edu/retail-dining/', 'All retail dining')} and ${ln('https://campusdining.syr.edu/menus/', 'menus')}. All Campus Dining locations are cashless: ’CUSE Cash, Meal Plan Dining Dollars, and cards.</p></div>`;
}
function viewRide(){
  const li = (r, c) => `<li class="rt ${c || ''}"><strong>${esc(r.name)}</strong>${r.note ? '. ' + esc(r.note) : ''}<br>${ln(r.sched, 'Schedule (PDF)')}${r.map ? ' and ' + ln(r.map, 'Route map') : ''}</li>`;
  const loopClass = r => r.name === 'Orange Loop' ? 'rt-orange' : r.name === 'Blue Loop' ? 'rt-blue' : '';
  return `<p class="note">Find the nearest stop, then pick the loop or route that goes where you’re headed. These are SU’s 2026–2027 academic-year schedules and they change during breaks.</p>
  <div class="sec"><h2>Stops near you</h2><p class="sub">Opens your map app. Your location stays on your phone and is only used to center the map.</p>
    <button class="btn sm" data-near="1" type="button">Show bus stops near me</button><p class="note" id="nearOut" aria-live="polite" hidden></p></div>
  <div class="sec"><h2>Live tracking</h2><ul class="plain"><li>${ln('https://subus.syr.edu/', 'SU bus and trolley tracker')} shows ’Cuse Trolleys and Centro’s SU routes with predicted arrivals, per SU. SU has posted outages for it before, so check the schedules too.</li><li>${ln('https://www.centro.org/how-to-ride/transit-tools', 'Centro transit tools')}: real-time bus tracking and the GoCentroBus app.</li></ul></div>
  <div class="sec"><h2>’Cuse Trolley loops</h2><p class="sub">Free with an SU or SUNY-ESF ID.</p><ul class="rts">${TRANSIT.loops.map(r => li(r, loopClass(r))).join('')}</ul></div>
  <div class="sec"><h2>Centro campus routes</h2><p class="sub">Per SU, SU344 and SU243 run until 11:00 pm. SU243 now runs as SU343, so check SU343’s own schedule. For other routes after 8:00 pm, use the trolley schedules.</p><ul class="rts">${TRANSIT.centro.map(r => li(r)).join('')}</ul></div>
  <div class="sec"><h2>Centro city routes</h2><ul class="rts">${TRANSIT.city.map(r => li(r)).join('')}</ul></div>
  <p class="note">Source: SU Parking and Transportation Services, campus shuttle schedules page. Questions: 315.443.4652.</p>`;
}
function viewAround(){
  return `<div class="seg" role="group" aria-label="Around"><button data-around="eat" aria-pressed="${st.around === 'eat'}" type="button">Eat</button><button data-around="ride" aria-pressed="${st.around === 'ride'}" type="button">Ride</button></div>${st.around === 'eat' ? viewEat() : viewRide()}`;
}
function locate(outId, term, fallbackQuery){
  const out = $(outId); if (!out) return;
  const show = (u, msg) => { out.hidden = false; out.innerHTML = ''; out.append(msg + ' '); const a = document.createElement('a'); a.className = 'ln'; a.href = u; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open the map'; out.appendChild(a); };
  const fb = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(fallbackQuery);
  if (!navigator.geolocation) { show(fb, 'Showing places near Newhouse 1.'); return; }
  out.hidden = false; out.textContent = 'Finding your location…';
  navigator.geolocation.getCurrentPosition(p => show(`https://www.google.com/maps/search/${term}/@${p.coords.latitude.toFixed(5)},${p.coords.longitude.toFixed(5)},17z`, 'Found you.'), () => show(fb, 'Location is off, so showing places near Newhouse 1.'), {timeout:8000});
}

/* ===== render + events ===== */
function render(){
  $('nav').innerHTML = navHTML();
  const views = {home:viewHome, scan:viewScan, schedule:viewSchedule, ask:viewAsk, around:viewAround};
  $('view').innerHTML = views[st.tab]();
  if (st.tab === 'ask') wireAsk();
  if (st.tab === 'scan') wireScan();
  const q = $('q');
  if (q) q.oninput = e => { st.q = e.target.value; const pos = e.target.selectionStart; render(); const n = $('q'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) {} } };
}
function go(tab, sub){
  st.tab = tab; st.q = ''; if (sub) st.around = sub;
  if (tab === 'home') { st.flow = null; st.bld = null; st.hiRoom = null; }
  render(); window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.tab) go(d.tab);
  else if (d.go) go(d.go, d.sub);
  else if (d.spin) spin();
  else if (d.flow) { st.flow = st.flow === d.flow ? null : d.flow; st.bld = null; st.hiRoom = null; render(); }
  else if (d.pday) { st.pday = +d.pday; render(); }
  else if (d.ptrack) { st.ptrack = d.ptrack; render(); }
  else if (d.build) {
    const like = st.ptrack === 'creative' ? 'the Creative track (image, video, and audio)' : st.ptrack === 'product' ? 'the Product Dev track (building and coding)' : 'a bit of everything';
    st.tab = 'ask'; render(); window.scrollTo(0, 0); askAI(`Plan my Day ${st.pday}. I like ${like}.`);
  }
  else if (d.bld) openBuilding(d.bld, d.room);
  else if (d.bback) { st.bld = null; st.hiRoom = null; render(); window.scrollTo(0, 0); }
  else if (d.find) findEvent(d.find);
  else if (d.live) { st.target = null; openCam(); }
  else if (d.camclose) closeCam();
  else if (d.camread) scanOnce(false);
  else if (d.camauto) { camAuto = !camAuto; if (camAuto) camScans = 0; updateAutoBtn(); }
  else if (d.roll) roll();
  else if (d.save) {
    const was = st.plan.has(d.save); if (was) st.plan.delete(d.save); else st.plan.add(d.save); persist();
    if (!was) { st.pop = d.save; const r = t.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2); setTimeout(() => { st.pop = null; }, 700); }
    render();
  }
  else if (d.addplan) {
    const r = t.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2);
    d.addplan.split(',').forEach(id => { if (SESSIONS.some(x => x.id === id)) st.plan.add(id); }); persist(); render();
  }
  else if (d.day) { st.day = +d.day; st.mine = false; render(); }
  else if (d.mine) { st.mine = true; render(); }
  else if (d.track) { st.track = d.track; render(); }
  else if (d.around) { st.around = d.around; render(); }
  else if (d.q) { if (!st.busy) askAI(d.q); }
  else if (d.mic) listen();
  else if (d.say) { const m = st.chat[+d.say]; if (m) { unlockAudio(); speak(m.content); } }
  else if (d.near) locate('nearOut', 'bus+stop', 'bus stop near 215 University Pl Syracuse NY');
  else if (d.eat) locate('eatOut', 'restaurants', 'restaurants near 215 University Pl Syracuse NY');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('cam') && !$('cam').hidden) closeCam(); });
$('camForm').onsubmit = e => {
  e.preventDefault();
  const list = readNums($('camNum').value);
  if (!list.length) { setStatus('Enter a three-digit room number, like 206F.'); return; }
  camLast = ''; showFound(list);
};
$('logo').onclick = () => go('home');
render();
</script>
