<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CuseCompass</title>
<meta name="description" content="Your pocket guide to the Syracuse AI Creative Summit: sessions, rooms, food, buses, and an AI assistant.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230B1146'/%3E%3Cpath d='M32 10l8 22H24z' fill='%23FF6B1A'/%3E%3Cpath d='M32 54l-8-22h16z' fill='%23F3F5FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5FF; --surface:#FFFFFF; --ink:#0B1146; --muted:#4B5485; --line:#CBD1EE; --edge:#0B1146;
  --tang:#FF6B1A; --lemon:#FFD84D; --sky:#9CCBFF; --on-tang:#1A0A00; --dial:#0B1146;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#080C33; --surface:#131A58; --ink:#F3F5FF; --muted:#AEB7EC; --line:#2B3586; --edge:#6C79D6; --dial:#05082B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#080C33; --surface:#131A58; --ink:#F3F5FF; --muted:#AEB7EC; --line:#2B3586; --edge:#6C79D6; --dial:#05082B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-0.02em;line-height:1.05;margin:0;}
p{margin:0;}
:focus-visible{outline:3px solid var(--tang);outline-offset:3px;}
.ln{color:inherit;font-weight:600;text-decoration:underline;text-decoration-color:var(--tang);text-decoration-thickness:2px;text-underline-offset:3px;}

/* shell */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto;padding:14px 16px 4px;}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;font:800 24px var(--f-display);letter-spacing:-0.03em;}
.logo svg{width:36px;height:36px;transition:transform .6s cubic-bezier(.3,1.6,.5,1);}
.logo:hover svg,.logo:focus-visible svg{transform:rotate(70deg);}
.hnote{color:var(--muted);font-size:14px;text-align:right;}
main{max-width:760px;margin:0 auto;padding:6px 16px 130px;}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:2px solid var(--edge);}
.nav button{position:relative;flex:1;max-width:124px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:0;border-radius:16px;background:transparent;color:var(--muted);font:700 12.5px var(--f-body);cursor:pointer;}
.nav button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.nav button.on{background:var(--tang);color:var(--on-tang);}
.cnt{position:absolute;top:-2px;right:10px;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:var(--lemon);color:#0B1146;font:800 12px/18px var(--f-display);font-style:normal;border:2px solid var(--edge);text-align:center;}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;}
.cf{position:absolute;width:9px;height:9px;border-radius:2px;}

/* buttons, chips, controls */
.btn{display:inline-block;text-decoration:none;font:700 16px var(--f-body);cursor:pointer;padding:11px 18px;border:2px solid var(--edge);border-radius:14px;background:var(--tang);color:var(--on-tang);box-shadow:0 4px 0 var(--edge);transition:transform .08s,box-shadow .08s;}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge);}
.btn.ghost{background:transparent;color:var(--ink);}
.btn.big{font-size:19px;padding:14px 30px;border-radius:999px;}
.btn.sm{padding:7px 14px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--edge);}
.btn[aria-pressed=true]{background:var(--lemon);color:#0B1146;}
.btn.pop{animation:stampin .45s cubic-bezier(.3,1.7,.5,1);}
@keyframes stampin{0%{transform:scale(1.5) rotate(-8deg);}100%{transform:scale(1) rotate(0);}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.chip{font:600 14.5px var(--f-body);cursor:pointer;padding:7px 14px;border:2px solid var(--edge);border-radius:999px;background:var(--surface);color:var(--ink);}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);}
.chip .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;border:2px solid #0B1146;vertical-align:-1px;}
.d-creative{background:var(--tang);} .d-product{background:var(--sky);} .d-all{background:var(--lemon);}
.sticker:nth-child(4n+1){background:var(--tang);color:var(--on-tang);transform:rotate(-1.6deg);}
.sticker:nth-child(4n+2){background:var(--lemon);color:#0B1146;transform:rotate(1.2deg);}
.sticker:nth-child(4n+3){background:var(--sky);color:#0B1146;transform:rotate(-0.8deg);}
.sticker:nth-child(4n){transform:rotate(1.6deg);}
.sticker{transition:transform .15s;}
.sticker:hover{transform:rotate(0) translateY(-2px);}
.seg{display:flex;border:2px solid var(--edge);border-radius:999px;overflow:hidden;background:var(--surface);margin:14px 0;}
.seg button{flex:1;font:700 15px var(--f-body);padding:10px 8px;border:0;background:transparent;color:var(--ink);cursor:pointer;}
.seg button+button{border-left:2px solid var(--edge);}
.seg button[aria-pressed=true]{background:var(--tang);color:var(--on-tang);}
.ctl{display:flex;gap:8px;margin:10px 0 0;}
.ctl input,#askIn{flex:1;min-width:0;font:500 16px var(--f-body);padding:12px 18px;border:2px solid var(--edge);border-radius:999px;background:var(--surface);color:var(--ink);}
.ctl input::placeholder,#askIn::placeholder{color:var(--muted);}
.note{margin:12px 0;padding:10px 14px;border-left:6px solid var(--lemon);background:var(--surface);font-size:14.5px;border-radius:4px 14px 14px 4px;}
.empty{margin:22px 0;color:var(--muted);font-size:17px;}
.src{color:var(--muted);font-size:13px;}

/* home */
.hero{padding:14px 0 6px;text-align:center;}
.hero h1{font-size:clamp(44px,13vw,82px);font-weight:800;letter-spacing:-0.045em;line-height:.9;}
.lead{margin:12px auto 0;max-width:30ch;color:var(--muted);font-size:17px;}
.dialwrap{width:min(80vw,330px);margin:22px auto 20px;}
#dial{display:block;width:100%;height:auto;overflow:visible;}
#needle{transform-origin:150px 150px;transition:transform 2.6s cubic-bezier(.12,.7,.15,1);}
.res{margin:22px auto 0;max-width:520px;text-align:left;border:2px solid var(--edge);border-radius:28px 28px 28px 8px;padding:18px 20px 20px;background:var(--surface);box-shadow:7px 7px 0 var(--zone,var(--tang));}
.res.fresh{animation:pop .5s cubic-bezier(.3,1.5,.5,1);}
@keyframes pop{from{transform:scale(.9) translateY(10px);opacity:0;}to{transform:none;opacity:1;}}
.tagc{display:inline-block;padding:2px 12px;border:2px solid #0B1146;border-radius:999px;color:#0B1146;font:800 14px var(--f-display);margin-bottom:8px;}
.res h2{font-size:26px;}
.res p{margin:6px 0 14px;color:var(--muted);}
.jam{margin:38px 0 0;padding:20px;border:2px solid var(--edge);border-radius:8px 30px 8px 30px;background:var(--surface);}
.jam h2{font-size:28px;}
.jam .sub{color:var(--muted);margin:4px 0 10px;}
.meter{height:14px;border:2px solid var(--edge);border-radius:99px;overflow:hidden;margin:6px 0 8px;background:var(--paper);}
.meter i{display:block;height:100%;background:var(--tang);transition:width .35s;}
.ck{display:flex;gap:14px;align-items:center;padding:11px 0;border-top:2px dashed var(--line);cursor:pointer;font-weight:500;}
.ck input{appearance:none;-webkit-appearance:none;width:28px;height:28px;border:2px solid var(--edge);border-radius:9px;background:var(--surface);display:grid;place-content:center;flex:none;cursor:pointer;transition:background .15s;margin:0;}
.ck input::after{content:"";width:13px;height:7px;border-left:3px solid var(--on-tang);border-bottom:3px solid var(--on-tang);transform:rotate(-45deg) scale(0);transition:transform .15s;margin-top:-3px;}
.ck input:checked{background:var(--tang);}
.ck input:checked::after{transform:rotate(-45deg) scale(1);}
.ck input:checked + span{text-decoration:line-through;opacity:.65;}

/* ask */
.askhead h2{font-size:34px;margin-bottom:6px;}
.askhead p{color:var(--muted);max-width:44ch;}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 4px;}
.chat{display:flex;flex-direction:column;gap:10px;margin:14px 0;}
.msg{max-width:88%;padding:11px 15px;white-space:pre-wrap;font-size:16px;line-height:1.45;border:2px solid var(--edge);}
.msg.u{align-self:flex-end;background:var(--tang);color:var(--on-tang);border-radius:20px 20px 4px 20px;}
.msg.a{align-self:flex-start;background:var(--surface);border-radius:20px 20px 20px 4px;}
.msg small{display:block;margin-top:6px;color:var(--muted);font-size:13px;}
.msg .btn{margin-top:10px;}
.dots{display:inline-flex;gap:5px;padding:5px 0;}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--ink);animation:bob 1s infinite ease-in-out;}
.dots i:nth-child(2){animation-delay:.15s;} .dots i:nth-child(3){animation-delay:.3s;}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-6px);opacity:1;}}
.askrow{display:flex;gap:8px;position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--paper);padding:10px 0;}

/* schedule */
.tl{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px;}
.tix{display:grid;grid-template-columns:98px 1fr auto;align-items:center;border:2px solid var(--edge);border-radius:26px 10px 10px 26px;background:var(--surface);overflow:hidden;}
.stub{align-self:stretch;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px 6px;border-right:2px dashed var(--edge);color:#0B1146;}
.stub b{font:800 17px var(--f-display);line-height:1.1;}
.stub i{font-style:normal;font-size:12.5px;line-height:1.2;margin-top:3px;}
.t-creative .stub{background:var(--tang);} .t-product .stub{background:var(--sky);} .t-all .stub{background:var(--lemon);}
.tb{padding:12px 14px;min-width:0;}
.ttl{font:800 18px/1.2 var(--f-display);letter-spacing:-0.01em;}
.who{color:var(--muted);font-size:14.5px;margin-top:3px;}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px;font-size:14.5px;}
.b{display:inline-block;padding:0 9px;border:2px solid var(--edge);border-radius:999px;font:700 12.5px var(--f-display);}
.loc{padding:0;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--tang);text-decoration-thickness:2px;text-underline-offset:3px;}
.loc.none{text-decoration:none;color:var(--muted);cursor:default;}
.tix .btn{margin-right:14px;}
.tip{margin-top:6px;font-size:14px;color:var(--muted);}
.hint{margin:0;padding:9px 14px;border-left:6px solid var(--tang);background:var(--surface);border-radius:4px 14px 14px 4px;font-size:14.5px;}
h2.day{font-size:24px;margin:22px 0 2px;}
@media (max-width:540px){
  .tix{grid-template-columns:82px 1fr;}
  .tix .btn{grid-column:1 / -1;margin:0 14px 14px;}
}

/* rooms */
details.bd{border:2px solid var(--edge);border-radius:26px;margin:14px 0;background:var(--surface);overflow:hidden;}
details.bd summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 18px;font:800 22px var(--f-display);color:#0B1146;}
details.bd summary::-webkit-details-marker{display:none;}
details.bd summary::after{content:"+";font:800 28px var(--f-display);margin-left:4px;}
details.bd[open] summary::after{content:"–";}
.bc{margin-left:auto;font:600 14px var(--f-body);}
.bd-nh1 summary{background:var(--tang);} .bd-nh2 summary{background:var(--sky);} .bd-nh3 summary{background:var(--lemon);} .bd-un summary{background:var(--paper);color:var(--ink);}
.bdin{padding:4px 18px 16px;}
.bdin h3{font-size:19px;margin:18px 0 4px;}
.rc{padding:12px 0;border-top:2px dashed var(--line);}
.rc b{font:800 17px var(--f-display);}
.rc ul,.plain{margin:4px 0 0;padding-left:20px;}
.plain li{margin:8px 0;}

/* around */
.roll{border:2px solid var(--edge);border-radius:28px;padding:18px 20px;background:var(--lemon);color:#0B1146;margin:12px 0 18px;box-shadow:7px 7px 0 var(--edge);}
.rollname{font:800 clamp(28px,8vw,40px) var(--f-display);letter-spacing:-0.03em;line-height:1;min-height:1.1em;}
.roll p{margin:8px 0 14px;font-size:15.5px;}
.sec{margin:26px 0 0;}
.sec h2{font-size:24px;margin-bottom:4px;}
.sec .sub{color:var(--muted);font-size:14.5px;margin-bottom:6px;}
.rts{list-style:none;margin:8px 0 0;padding:0;}
.rt{margin:8px 0;padding:10px 14px;background:var(--surface);border-left:9px solid var(--c,var(--edge));border-radius:6px 18px 18px 6px;font-size:15px;}
.rt strong{font-family:var(--f-display);font-size:17px;}
.rt-orange{--c:var(--tang);} .rt-blue{--c:var(--sky);}


/* voice and photo */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 0;}
.ck2{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;cursor:pointer;}
.ck2 input{width:20px;height:20px;accent-color:var(--tang);}
.snap{display:block;max-width:180px;width:100%;border-radius:14px;border:2px solid #1A0A00;margin-bottom:8px;}
.snapchip{display:inline-flex;align-items:center;gap:10px;margin:10px 0 0;padding:6px 10px;border:2px solid var(--edge);border-radius:16px;background:var(--surface);font-size:14px;}
.snapchip img{width:44px;height:44px;object-fit:cover;border-radius:8px;}


/* live camera */
.cam{position:fixed;inset:0;z-index:70;background:#000;color:#F3F5FF;}
.cam[hidden]{display:none;}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.camtop{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;}
.cam .btn.ghost{color:#F3F5FF;border-color:#F3F5FF;box-shadow:0 3px 0 #F3F5FF;background:rgba(5,8,43,.55);}
.reticle{position:absolute;left:10%;right:10%;top:24%;height:26%;border:4px solid var(--tang);border-radius:26px;box-shadow:0 0 0 9999px rgba(5,8,43,.28);pointer-events:none;}
.camout{position:absolute;left:14px;right:14px;bottom:calc(104px + env(safe-area-inset-bottom,0px));padding:12px 16px;border-radius:20px 20px 20px 6px;background:rgba(5,8,43,.88);font-size:17px;line-height:1.4;max-height:34vh;overflow:auto;}
.camctl{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;}
}
</style>
</head>
<body>
<header class="top">
  <button class="logo" id="logo" type="button" aria-label="CuseCompass home">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#0B1146" stroke="#FF6B1A" stroke-width="4"/><path d="M32 11l8 21H24z" fill="#FF6B1A"/><path d="M32 53l-8-21h16z" fill="#F3F5FF"/><circle cx="32" cy="32" r="3.5" fill="#0B1146"/></svg>
    CuseCompass
  </button>
  <span class="hnote">AI Creative Summit</span>
</header>
<main id="view"></main>
<nav class="nav" id="nav" aria-label="Main"></nav>
<div id="fx" aria-hidden="true"></div>
<div class="cam" id="cam" hidden role="dialog" aria-label="Live camera">
  <video id="camVid" playsinline muted autoplay></video>
  <div class="camtop"><button class="btn sm ghost" data-camclose="1" type="button">Close</button></div>
  <div class="reticle" aria-hidden="true"></div>
  <div class="camout" id="camOut" aria-live="polite"></div>
  <div class="camctl"><button class="btn big" id="camBtn" data-camread="1" type="button">Read the sign</button></div>
</div>

<script>
/* ===== helpers ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const matches = (text, q) => !q || text.toLowerCase().includes(q.toLowerCase());
const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const ln = (u, t) => `<a class="ln" href="${u}" target="_blank" rel="noopener">${t}</a>`;
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ===== REAL DATA: copied from the 2026 AI Creative Summit event deck ===== */
const BUILDINGS = {nh1:'Newhouse 1', nh2:'Newhouse 2', nh3:'Newhouse 3'};

const ROOMS = [
  {id:'r432', b:'nh3', name:'Rooms 432/434', note:'Creative track sessions on Day 1 take place here. Room 434 is also known as the I-3 Center, per the SU events calendar.'},
  {id:'r101', b:'nh1', name:'Room 101', note:''},
  {id:'r102', b:'nh1', name:'Room 102', note:'Product Dev / Vibe Code track sessions on Day 1 take place here.'},
  {id:'r206f', b:'nh1', name:'Room 206F', note:'Per the deck, the free open-source image and video generators (Qwen 2.1, Flux 3, MiniMax H3) are available in the 206F lab. Coaches and mentors are around here. On the SU floor plan, 206F is on the second floor of Newhouse 1, in a corner beside 206D and 206E.'},
  {id:'r220', b:'nh1', name:'Room 220', note:'Coaches and mentors are around here. It appears on Newhouse 1’s second-floor plan.'},
  {id:'r222', b:'nh1', name:'Room 222', note:'Coaches and mentors are around here. It appears on Newhouse 1’s second-floor plan.'},
  {id:'r225', b:'nh1', name:'Room 225', note:'Coaches and mentors are around here.'},
  {id:'r469', b:'nh2', name:'Room 469', note:''},
  {id:'garage', b:null, name:'Startup Garage', note:'The deck doesn’t list which building it is in. Ask a coach or organizer. Coaches and mentors are around here.'}
];
const SU_MAP = {nh1:'https://maps.syracuse.edu/?id=1275#!ce/34413', nh2:'https://maps.syracuse.edu/?id=1275', nh3:'https://maps.syracuse.edu/?id=1275'};
const ROOM = Object.fromEntries(ROOMS.map(r => [r.id, r]));

/* ===== VERIFIED NEWHOUSE ROOM DIRECTORY (names only, no layouts) =====
   src: L = Newhouse reservable-rooms list, C = SU events calendar, I = SU IT classroom page, P = SU campus map floor plan, D = SU Campus Dining */
const SRC = {L:'Newhouse reservable-rooms list', C:'SU events calendar', I:'SU IT classroom page', P:'SU campus map floor plan', D:'SU Campus Dining'};
const DIRECTORY = [
  {b:'nh1', name:'Lobby / Newhouse Patio', note:'Used as a meeting spot in past SU events.', src:['L','C']},
  {b:'nh1', floor:3, name:'Room 303', note:'Reservable room.', src:['L','C','P']},
  {b:'nh1', floor:3, name:'Room 305 (Dressler Room)', note:'Third floor, per the SU events calendar.', src:['L','C','P']},
  {b:'nh1', name:'Room 407', note:'Reservable room.', src:['L']},
  {b:'nh1', name:'Room 409', note:'Used for advising events in past years.', src:['C']},
  {b:'nh1', floor:2, name:'Room 205A', note:'Classroom listed by SU IT.', src:['I','P']},
  {b:'nh1', floor:2, name:'Room 212', note:'Classroom listed by SU IT.', src:['I','P']},
  {b:'nh1', name:'Room 406', note:'Classroom listed by SU IT.', src:['I']},
  {b:'nh2', floor:3, name:'Room 340', note:'Classroom listed by SU IT.', src:['I','P']},
  {b:'nh2', floor:3, name:'Room 345', note:'Classroom listed by SU IT.', src:['I','P']},
  {b:'nh2', floor:3, name:'Room 350', note:'Classroom listed by SU IT.', src:['I','P']},
  {b:'nh2', floor:3, name:'Room 355', note:'Classroom listed by SU IT.', src:['I','P']},
  {b:'nh3', name:'Lobby (first floor)', note:'Reservable space.', src:['L','C']},
  {b:'nh3', name:'Room 140 (Hergenhan Auditorium)', note:'SU IT lists the auditorium as 3-104, but the events calendar and room list say 140. Confirm on the door sign.', src:['L','C','I']},
  {b:'nh3', name:'Room 141', note:'Technology classroom with 106 seats, per SU IT.', src:['L','I']},
  {b:'nh3', floor:2, name:'Room 244', note:'Reservable room. SU Campus Dining lists the food.com café at this room number.', src:['L','D','P']},

/* ===== voice: ElevenLabs through /api/speak, with the browser voice as backup ===== */
let voicePlayer = null;
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
function unlockAudio(){ try { if (!voicePlayer) voicePlayer = new Audio(); voicePlayer.src = SILENT; const p = voicePlayer.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
function stopSpeak(){ try { if (voicePlayer) voicePlayer.pause(); if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {} }
async function speak(text){
  if (!text) return; stopSpeak();
  try {
    const r = await fetch('/api/speak', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({text:String(text).slice(0, 600)})});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const url = URL.createObjectURL(await r.blob());
    if (!voicePlayer) voicePlayer = new Audio();
    voicePlayer.src = url;

const SNAP_Q = 'Read the room number or sign in this photo and tell me what’s there.';
function fileToJpeg(file, max){
  max = max || 1024;
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', 0.72); res({url, data:url.split(',')[1], media_type:'image/jpeg'}); };
      img.onerror = () => res(null); img.src = fr.result; };
    fr.onerror = () => res(null); fr.readAsDataURL(file);
  });
}

  const el = $('snapPrev'); if (!el) return;

async function askAI(q, img){
  stopSpeak();

  const history = st.chat.slice(-8).map(m => ({role:m.role, content:m.content}));
  let out;
  try {
    const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 40000);
    const body = {messages:history, context:buildContext()};
    if (img) body.image = {media_type:img.media_type, data:img.data};
    const r = await fetch('/api/ask', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body), signal:ctrl.signal});
    clearTimeout(to);

    out = img ? {reply:'I can’t read photos right now. Check the room number on the door sign and search it in the Rooms tab.', add:[], offline:true} : localAnswer(q);

  else if (d.day) { st.day = +d.day; st.mine = false; render(); }
  else if (d.mine) { st.mine = true; render(); }
  else if (d.track) { st.track = d.track; render(); }
  else if (d.around) { st.around = d.around; render(); }
  else if (d.q) { if (!st.busy) askAI(d.q); }
  else if (d.brain) { st.tab = 'ask'; render(); window.scrollTo(0, 0); askAI(`Give me three fun, PG ideas for the Gen Jam challenge "${d.brain}".`); }
  else if (d.mic) listen();
  else if (d.live) openCam();
  else if (d.camread) readFrame();
  else if (d.camclose) closeCam();
  else if (d.snapbtn) { const s = $('snap'); if (s) s.click(); }
  else if (d.snapx) { st.img = null; updateSnap(); }
  else if (d.say) { const m = st.chat[+d.say]; if (m) { unlockAudio(); speak(m.content); } }
  else if (d.near) locate('nearOut', 'bus+stop', 'bus stop near 215 University Pl Syracuse NY');
  else if (d.eat) locate('eatOut', 'restaurants', 'restaurants near 215 University Pl Syracuse NY');
});
document.addEventListener('change', e => {
  if (e.target && e.target.id === 'snap') { handleSnap(e.target); return; }
  const k = e.target && e.target.dataset && e.target.dataset.jam; if (!k) return;
  const r = e.target.getBoundingClientRect();
  st.jam[k] = e.target.checked; persistJam();
  const all = JAM_ITEMS.every(([key]) => st.jam[key]);
  if (all && e.target.checked) burst(r.left + r.width / 2, r.top + r.height / 2);
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('cam') && !$('cam').hidden) closeCam(); });
$('logo').onclick = () => go('home');
render();
</script>
</body>
